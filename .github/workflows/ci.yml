name: Frameforge CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Python 3.12 - tests and smoke check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit and API tests
        run: python -m pytest -q
      - name: Compile Python files
        run: python -m compileall -q frameforge
      - name: Smoke test application (no public port)
        env:
          FRAMEFORGE_LOCAL_DEMO: '1'
        run: |
          python - <<'PYTEST'
          from fastapi.testclient import TestClient
          from frameforge.api import app
          with TestClient(app) as client:
              response = client.get('/health')
              assert response.status_code == 200, response.text
              assert response.json()['actual_media_generation'] is False
              assert client.get('/').status_code == 200
          print('Health and dashboard smoke checks passed')
          PYTEST
