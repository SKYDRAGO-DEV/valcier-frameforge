name: Import verified FRAMEFORGE source package

on:
  push:
    branches: [main]
    paths:
      - 'VALCIER_FRAMEFORGE_GitHub_Ready.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify and safely extract release archive
        env:
          EXPECTED_SHA256: b5b933233cadeef78470e3e730bc369027ccd564abb446e43f6829efcfde1534
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, os, stat, zipfile
          archive=Path("VALCIER_FRAMEFORGE_GitHub_Ready.zip")
          if not archive.exists():
              raise SystemExit("Missing release archive. Upload VALCIER_FRAMEFORGE_GitHub_Ready.zip to repository root.")
          raw=archive.read_bytes()
          if hashlib.sha256(raw).hexdigest()!=os.environ["EXPECTED_SHA256"]:
              raise SystemExit("Unexpected archive hash: refusing to unpack an unverified package")
          with zipfile.ZipFile(archive) as z:
              for item in z.infolist():
                  path=PurePosixPath(item.filename)
                  if path.is_absolute() or ".." in path.parts or not path.parts or item.file_size > 5_000_000:
                      raise SystemExit("Unsafe archive entry")
                  if stat.S_IFMT(item.external_attr >> 16)==stat.S_IFLNK:
                      raise SystemExit("Symlinks not permitted")
                  if item.is_dir(): continue
                  target=Path(*path.parts)
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(z.read(item))
          print("Verified source package extracted")
          PY
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Verify package
        run: |
          cd backend
          python -m pytest -q
          python -m compileall -q frameforge
          FRAMEFORGE_LOCAL_DEMO=1 python - <<'PY'
          from fastapi.testclient import TestClient
          from frameforge.api import app
          with TestClient(app) as c:
              assert c.get("/health").status_code == 200
              assert c.get("/").status_code == 200
          print("Smoke tests passed")
          PY
      - name: Commit verified source files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm VALCIER_FRAMEFORGE_GitHub_Ready.zip
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat: import verified FRAMEFORGE MVP source and CI"
            git push
          fi
